{% extends "base.html" %}{% block content %}<h1>Doctor management</h1><div class="card"><h3>Add doctor</h3><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-2" name="name" placeholder="Full name" required><input class="form-control mb-2" name="email" type="email" placeholder="Email" required><input class="form-control mb-2" name="password" type="password" placeholder="Temporary password (10+ chars)" minlength="10" required><input class="form-control mb-2" name="specialization" placeholder="Specialization" required><button class="btn btn-primary">Create doctor</button></form></div><div class="card mt-3"><h3>Doctors</h3>{% for d in items %}<p>{{ d.user.full_name }} — {{ d.specialization }}</p>{% else %}<p>No doctors.</p>{% endfor %}</div>{% endblock %}
