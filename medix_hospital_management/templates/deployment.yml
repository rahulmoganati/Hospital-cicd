
apiVersion: apps/v1
kind: Deployment

metadata:
  name: medix-hospital

spec:
  replicas: 1

  selector:
    matchLabels:
      app: medix-hospital

  template:
    metadata:
      labels:
        app: medix-hospital

    spec:
      containers:
        - name: medix-hospital
          image: rahul7989/medix-hospital:2.1
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
              protocol: TCP

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
