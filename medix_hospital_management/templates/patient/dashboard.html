{% extends "base.html" %}{% block content %}<h1>Patient portal</h1><div class="card"><h3>Book appointment</h3><form method="post" action="{{ url_for('patient.book_page') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Doctor</label><select class="form-select mb-2" name="doctor_id" required>{% for d in doctors %}<option value="{{ d.id }}">{{ d.user.full_name }} — {{ d.specialization }}</option>{% endfor %}</select><label>Date and time</label><input class="form-control mb-2" type="datetime-local" name="appointment_at" required><label>Reason</label><textarea class="form-control mb-2" name="reason" required></textarea><button class="btn btn-primary">Request appointment</button></form></div><div class="card mt-3"><h3>My appointments</h3>{% for a in items %}<p>{{ a.doctor.user.full_name }} · {{ a.appointment_at }} · {{ a.status }}</p>{% else %}<p>No appointments yet.</p>{% endfor %}</div>{% endblock %}
