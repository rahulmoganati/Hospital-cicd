{% extends "base.html" %}{% block content %}<h1>Doctor workspace</h1><p>{{ profile.specialization }}</p><div class="card"><h3>Appointments</h3>{% for a in items %}<div class="appointment"><b>{{ a.patient.user.full_name }}</b> · {{ a.appointment_at }} · {{ a.reason }} · {{ a.status }}<form method="post" action="{{ url_for('doctor.update_status',item_id=a.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="status" class="form-select">{% for s in ['Confirmed','Rejected','Completed','Cancelled'] %}<option>{{ s }}</option>{% endfor %}</select><button class="btn btn-sm btn-primary mt-1">Update</button></form></div>{% else %}<p>No appointments assigned.</p>{% endfor %}</div>{% endblock %}
