
name: Medix Hospital CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout application code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Validate Docker credentials
      - name: Validate Docker Secrets
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$DOCKER_USER" || (echo "Docker username missing" && exit 1)
          test -n "$DOCKER_PASS" || (echo "Docker password missing" && exit 1)
          echo "Docker credentials are available"

      # 3. Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t rahul7989/medix-hospital:${{ github.sha }} .

      # 5. Push image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push rahul7989/medix-hospital:${{ github.sha }}

      # 6. Deploy to Kubernetes on EC2
      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: rahul7989/medix-hospital:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE
          script: |
            sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              set image deployment/medix-hospital \
              medix-hospital=$IMAGE

            sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              rollout status deployment/medix-hospital \
              --timeout=180s
