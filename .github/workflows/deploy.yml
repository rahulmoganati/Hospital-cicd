
name: Medix Hospital CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medix-hospital-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Check repository structure
      - name: Check Repository Files
        run: |
          echo "Current working directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Dockerfile location:"
          find . -iname '*dockerfile*'

          echo "Requirements file location:"
          find . -name requirements.txt

      # 3. Read Dockerfile
      - name: Read Dockerfile
        run: |
          DOCKERFILE_PATH="./medix_hospital_management/templates/Dockerfile"

          if [ ! -f "$DOCKERFILE_PATH" ]; then
            echo "ERROR: Dockerfile not found"
            exit 1
          fi

          echo "Dockerfile found successfully"
          cat "$DOCKERFILE_PATH"

      # 4. Validate Docker build context
      - name: Validate Build Context
        run: |
          if [ ! -f "./medix_hospital_management/requirements.txt" ]; then
            echo "ERROR: requirements.txt missing"
            exit 1
          fi

          echo "Build context validated"

      # 5. Validate Docker credentials
      - name: Validate Docker Secrets
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$DOCKER_USER" || {
            echo "Docker username missing"
            exit 1
          }

          test -n "$DOCKER_PASS" || {
            echo "Docker password missing"
            exit 1
          }

          echo "Docker credentials available"

      # 6. Docker Hub Login
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            --pull \
            -f ./medix_hospital_management/templates/Dockerfile \
            -t rahul7989/medix-hospital:${{ github.sha }} \
            ./medix_hospital_management

      # 8. Push Docker image
      - name: Push Docker Image
        run: |
          docker push rahul7989/medix-hospital:${{ github.sha }}

      # 9. Validate EC2 secrets and hostname
      - name: Validate EC2 Host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || {
            echo "ERROR: EC2_HOST is missing"
            exit 1
          }

          test -n "$EC2_USER" || {
            echo "ERROR: EC2_USER is missing"
            exit 1
          }

          test -n "$SSH_KEY" || {
            echo "ERROR: SSH_KEY is missing"
            exit 1
          }

          python3 - <<'PY'
          import os
          import ipaddress
          import socket

          host = os.environ["EC2_HOST"]

          if host != host.strip():
              raise SystemExit("ERROR: EC2_HOST contains spaces")

          try:
              ipaddress.ip_address(host)
              print("EC2_HOST is a valid IP address")
          except ValueError:
              try:
                  socket.getaddrinfo(host, 22)
                  print("EC2 hostname resolved successfully")
              except socket.gaierror as error:
                  raise SystemExit(
                      f"EC2 hostname DNS resolution failed: {error}"
                  )
          PY

          echo "EC2 configuration validated"

      # 10. Deploy to Kubernetes on EC2
      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: rahul7989/medix-hospital:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          envs: IMAGE
          script: |
            echo "SSH connection successful"

            echo "Checking Kubernetes nodes"

            sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              get nodes

            echo "Updating Medix Hospital deployment"

            sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              set image deployment/medix-hospital \
              medix-hospital=$IMAGE

            echo "Waiting for Kubernetes rollout"

            sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              rollout status deployment/medix-hospital \
              --timeout=180s

            echo "Checking application pods"

            sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              get pods -o wide

            echo "Medix Hospital deployment completed"
